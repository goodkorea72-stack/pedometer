<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>만보기</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f7; color: #1d1d1f; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.card { background: #fff; border-radius: 24px; padding: 32px 24px; width: 100%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
.sub { color: #86868b; font-size: 15px; margin-bottom: 24px; }
.big { font-size: 72px; font-weight: 800; font-variant-numeric: tabular-nums; margin-bottom: 12px; }
.unit { font-size: 20px; color: #86868b; margin-bottom: 24px; }
.row { display: flex; gap: 10px; margin-bottom: 16px; }
input { flex: 1; padding: 14px 16px; font-size: 16px; border: 1px solid #d2d2d7; border-radius: 12px; background: #f5f5f7; }
button { flex: 1; padding: 14px 16px; font-size: 16px; font-weight: 600; border: none; border-radius: 12px; cursor: pointer; }
.add { background: #007aff; color: #fff; }
.add:active { background: #0062cc; }
.reset { background: #ff3b30; color: #fff; }
.reset:active { background: #d70018; }
.hint { font-size: 13px; color: #86868b; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>만보기</h1>
  <p class="sub">누적 걸음 수</p>
  <div class="big" id="display">0</div>
  <div class="unit">걸음</div>
  <div class="row">
    <input type="number" id="amount" placeholder="걸음 수" min="0">
    <button class="add" onclick="addSteps()">추가</button>
  </div>
  <button class="reset" onclick="resetSteps()">초기화</button>
  <p class="hint">브라우저에 저장됩니다.</p>
</div>
<script>
const STORAGE_KEY = 'pedometer_steps';
const display = document.getElementById('display');
const amountInput = document.getElementById('amount');

function render() {
  const steps = localStorage.getItem(STORAGE_KEY);
  display.textContent = steps ? Number(steps).toLocaleString() : '0';
}

function addSteps() {
  const n = parseInt(amountInput.value, 10);
  if (!n || n < 0) {
    amountInput.value = '';
    return;
  }
  const current = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
  localStorage.setItem(STORAGE_KEY, current + n);
  amountInput.value = '';
  render();
}

function resetSteps() {
  if (!confirm('걸음 수를 초기화할까요?')) return;
  localStorage.removeItem(STORAGE_KEY);
  render();
}

render();
</script>
</body>
</html>
